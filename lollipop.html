<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Lollipop</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0a14;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .head {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    padding: 8px;
    background: #fff;
    box-shadow:
      0 0 15px #ff0080,
      0 0 35px #ff0080,
      0 0 65px #ff0080;
  }
  .inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    background: conic-gradient(
      from 0deg,
      #ff0080 0deg 30deg,
      #fff 30deg 60deg,
      #00ffff 60deg 90deg,
      #fff 90deg 120deg,
      #ffcc00 120deg 150deg,
      #fff 150deg 180deg,
      #ff0080 180deg 210deg,
      #fff 210deg 240deg,
      #00ffff 240deg 270deg,
      #fff 270deg 300deg,
      #ffcc00 300deg 330deg,
      #fff 330deg 360deg
    );
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .inner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-radial-gradient(circle at center, transparent 0 14px, rgba(0,0,0,0.07) 14px 15px);
    border-radius: 50%;
  }
  .center {
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 50%;
    border: 2px solid #ff0080;
    z-index: 1;
  }
  .highlight {
    position: absolute;
    width: 48px;
    height: 28px;
    background: rgba(255,255,255,0.85);
    border-radius: 50%;
    top: 30px;
    left: 44px;
    transform: rotate(-25deg);
    z-index: 2;
  }
  .stick {
    width: 20px;
    height: 160px;
    background: linear-gradient(90deg, #e0e0e0, #fff 50%, #d0d0d0);
    border-radius: 0 0 10px 10px;
    margin-top: -6px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="inner">
        <div class="center"></div>
        <div class="highlight"></div>
      </div>
    </div>
    <div class="stick"></div>
  </div>
</body>
</html>
